<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mantenimiento Industrial{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{% url 'maintenance:home' %}">Inicio</a>

        {% if user.is_authenticated %}
            <a href="{% url 'maintenance:panel' %}">Mi panel</a>
            <span>Hola, {{ user.username }}</span>

            <!-- Cerrar sesión debe ser POST (más seguro), por eso usa un formulario -->
            <form method="post" action="{% url 'logout' %}" style="display:inline">
                {% csrf_token %}
                <button type="submit">Salir</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Entrar</a>
        {% endif %}
    </nav>
    <hr>

    {% block content %}{% endblock %}
</body>
</html>
